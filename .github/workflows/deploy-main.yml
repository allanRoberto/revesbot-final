name: Deploy Main

on:
  push:
    branches:
      - main
    paths-ignore:
      - "apps/api/**"
      - "apps/monitoring/patterns/**"
      - "apps/monitoring/requirements-patterns*.txt"
      - "apps/monitoring/tests/test_pattern_platform.py"
      - "apps/app/**"
      - "apps/auth_api/**"
      - "apps/bet_ws/**"
      - "apps/house_agent/**"
      - "infra/deploy/app/**"
      - "infra/deploy/auth/**"
      - "infra/deploy/api/**"
      - "infra/deploy/patterns/**"
      - "infra/nginx/app-revesbot.conf"
      - "infra/nginx/auth-revesbot.conf"
      - "infra/pm2/app-stack.config.js"
      - "infra/pm2/auth-api.config.js"
      - "infra/pm2/api-minimal.config.js"
      - "infra/pm2/patterns.config.js"
      - "infra/systemd/revesbot-app-health.*"
      - "infra/systemd/revesbot-auth-health.*"
      - "infra/systemd/revesbot-api-watchdog.*"
      - "infra/systemd/revesbot-patterns-watchdog.*"
      - ".github/workflows/deploy-app.yml"
      - ".github/workflows/deploy-auth.yml"
      - ".github/workflows/deploy-api.yml"
      - ".github/workflows/deploy-patterns.yml"
      - "apps/collector/**"
      - "infra/deploy/collector/**"
      - "infra/docker/collector-test.compose.yml"
      - "infra/docker/collector-prod.compose.yml"
      - "infra/logrotate/**"
      - "infra/pm2/collector.config.js"
      - "infra/systemd/revesbot-collector-watchdog.*"
      - "infra/systemd/revesbot-redis-tunnel.service"
      - "docs/collector-operations.md"
      - ".github/workflows/deploy-collector.yml"
      - ".github/workflows/deploy-main.yml"
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: 45.179.88.173
          DEPLOY_USER: root
        run: |
          if [[ -z "$DEPLOY_SSH_KEY" ]]; then
            echo "Missing GitHub secret: DEPLOY_SSH_KEY" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy main
        shell: bash
        env:
          DEPLOY_HOST: 45.179.88.173
          DEPLOY_USER: root
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -lc 'cd /var/www/revesbot-final && ./infra/deploy/deploy.sh main'"
