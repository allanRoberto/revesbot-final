name: Test and deploy patterns

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/monitoring/patterns/**"
      - "apps/monitoring/requirements-patterns*.txt"
      - "apps/monitoring/tests/test_pattern_platform.py"
      - "infra/deploy/patterns/**"
      - "infra/logrotate/revesbot-patterns"
      - "infra/pm2/patterns.config.js"
      - "infra/systemd/revesbot-patterns-watchdog.*"
      - ".github/workflows/deploy-patterns.yml"
  push:
    branches: [main]
    paths:
      - "apps/monitoring/patterns/**"
      - "apps/monitoring/requirements-patterns*.txt"
      - "apps/monitoring/tests/test_pattern_platform.py"
      - "infra/deploy/patterns/**"
      - "infra/logrotate/revesbot-patterns"
      - "infra/pm2/patterns.config.js"
      - "infra/systemd/revesbot-patterns-watchdog.*"
      - ".github/workflows/deploy-patterns.yml"
  workflow_dispatch:

concurrency:
  group: patterns-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/monitoring/requirements-patterns-dev.txt
      - name: Install dependencies
        run: python -m pip install -r apps/monitoring/requirements-patterns-dev.txt
      - name: Validate pattern processes
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q apps/monitoring/tests/test_pattern_platform.py
          python -m compileall -q apps/monitoring/patterns
          node --check infra/pm2/patterns.config.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: patterns-production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.PATTERNS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PATTERNS_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy exact commit
        env:
          DEPLOY_HOST: ${{ vars.PATTERNS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.PATTERNS_DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "${GITHUB_SHA}"
