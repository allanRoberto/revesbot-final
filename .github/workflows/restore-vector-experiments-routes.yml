name: Restore vector experiments routes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vector-experiments-nginx-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: api-production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.API_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.API_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Republish the active experimental routes
        env:
          DEPLOY_HOST: ${{ vars.API_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.API_DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          ssh -T "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          runtime="$(sudo -u revesbot-vector-experiments env \
            PM2_HOME=/var/lib/revesbot-vector-experiments/pm2 \
            pm2 jlist | /usr/bin/python3 -c '
          import json, sys
          processes = json.load(sys.stdin)
          active = [p for p in processes if p.get("name") == "vector-experiments-api"
                    and p.get("pm2_env", {}).get("status") == "online"]
          if len(active) != 1:
              raise SystemExit("expected_one_online_experimental_api")
          print(active[0]["pm2_env"]["pm_cwd"])
          ')"
          case "$runtime" in
            /opt/revesbot-vector-experiments/releases/*) ;;
            *) echo "experimental_runtime_path_rejected" >&2; exit 1 ;;
          esac
          test -x "$runtime/.venv-experiments/bin/python"
          test -f "$runtime/infra/deploy/vector-experiments/publish.py"
          sudo "$runtime/.venv-experiments/bin/python" \
            "$runtime/infra/deploy/vector-experiments/publish.py" \
            --runtime "$runtime" \
            --vhost /etc/nginx/sites-available/api-revesbot.conf
          REMOTE
