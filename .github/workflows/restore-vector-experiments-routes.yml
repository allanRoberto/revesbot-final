name: Restore vector experiments routes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vector-experiments-nginx-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: api-production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.API_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.API_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Republish the active experimental routes
        env:
          DEPLOY_HOST: ${{ vars.API_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.API_DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          ssh -T "$DEPLOY_USER@$DEPLOY_HOST" restore-vector-experiments-routes
