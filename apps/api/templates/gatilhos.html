<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gatilhos</title>
  <style>
    :root {
      --bg: #f6f7f9; --surface: #fff; --surface-soft: #eef3f1;
      --border: #d7ddd9; --text: #18211f; --muted: #63706b;
      --accent: #177a5b; --accent-strong: #0f5f46;
      --danger: #9b2f2f; --warn: #b6862c;
      --trigger-color: #a85c00; --trigger-bg: rgba(168,92,0,.13);
      --triplet-color: #0f5f46; --triplet-bg: rgba(23,122,91,.13);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 24px 16px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .page-header { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    .page-header h1 { margin: 0 0 4px; font-size: 22px; color: var(--accent-strong); }
    .page-header .subtitle { margin: 0; font-size: 13px; color: var(--muted); }
    .status-bar { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
    .dot.live { background: var(--accent); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .back-link { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--accent); text-decoration: none; margin-bottom: 14px; }
    .back-link:hover { text-decoration: underline; }
    .filter-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .filter-btn { padding: 4px 12px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--surface); font-size: 12px; font-weight: 600; cursor: pointer; color: var(--muted); }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent-strong); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .summary-row { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
    .summary-row strong { color: var(--text); }
    .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 860px; }
    thead tr { background: var(--surface-soft); border-bottom: 2px solid var(--border); }
    thead th { padding: 10px 12px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); white-space: nowrap; user-select: none; }
    thead th.sortable { cursor: pointer; }
    thead th.sortable:hover { color: var(--accent-strong); background: #e8efec; }
    thead th.center { text-align: center; }
    thead th .sort-icon { display: inline-block; margin-left: 4px; opacity: .35; font-size: 10px; }
    thead th.active { color: var(--accent-strong); }
    thead th.active .sort-icon { opacity: 1; color: var(--accent); }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f9fafb; }
    tbody tr.row-expired { opacity: .5; }
    td { padding: 8px 12px; vertical-align: middle; }
    td.center { text-align: center; }
    .date-cell .date { font-size: 12px; font-weight: 600; white-space: nowrap; }
    .date-cell .time { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .num-chip { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .num-chip.trigger { background: var(--trigger-bg); color: var(--trigger-color); border: 2px solid #c97a1a; font-size: 14px; width: 36px; height: 36px; }
    .num-chip.alvo { background: var(--triplet-bg); color: var(--triplet-color); border: 1.5px solid var(--accent); }
    .num-chip.zero { background: #1a1a1a; color: #fff; border: 2px solid #555; }
    .alvos-cell { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .arrow { font-size: 11px; color: var(--muted); }
    .roulette-badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--surface-soft); color: var(--accent-strong); border: 1px solid var(--border); white-space: nowrap; }
    .roulette-badge.auto { background: rgba(23,122,91,.10); border-color: rgba(23,122,91,.25); }
    .roulette-badge.brazil { background: rgba(0,102,204,.09); color: #005599; border-color: rgba(0,102,204,.2); }
    .roulette-badge.mega { background: rgba(120,40,180,.09); color: #6a1fa0; border-color: rgba(120,40,180,.2); }
    .pct-badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--trigger-bg); color: var(--trigger-color); border: 1px solid rgba(168,92,0,.22); white-space: nowrap; }
    .signals-cell { font-size: 12px; white-space: nowrap; line-height: 1.5; }
    .signals-cell .won { color: var(--accent-strong); font-weight: 700; }
    .signals-cell .lost { color: var(--danger); font-weight: 700; }
    .signals-cell .assert-pct { font-size: 13px; font-weight: 700; }
    .signals-cell .assert-pct.high { color: var(--accent-strong); }
    .signals-cell .assert-pct.low  { color: var(--danger); }
    .signals-cell .assert-pct.mid  { color: var(--warn); }
    .status-badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 8px; font-size: 11px; font-weight: 700; }
    .status-badge.pending { background: rgba(23,122,91,.10); color: var(--accent-strong); border: 1px solid rgba(23,122,91,.3); }
    .status-badge.pending_confirmation { background: rgba(0,102,204,.10); color: #005599; border: 1px solid rgba(0,102,204,.3); }
    .status-badge.expired { background: #f0f0f0; color: #888; border: 1px solid #ccc; }
    .conf-progress { display: inline-flex; align-items: center; gap: 2px; margin-top: 3px; }
    .conf-pip { width: 8px; height: 8px; border-radius: 50%; background: #ccc; display: inline-block; }
    .conf-pip.filled { background: #005599; }
    .btn-action { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; font-size: 13px; transition: all .15s; }
    .btn-action:hover { border-color: var(--accent); background: var(--surface-soft); }
    .btn-action.danger:hover { border-color: var(--danger); background: rgba(155,47,47,.07); }
    .actions-cell { display: flex; gap: 5px; align-items: center; }
    .empty-state { text-align: center; padding: 48px 24px; color: var(--muted); }
    .loading { text-align: center; color: var(--muted); padding: 40px; font-size: 14px; }
    .error-msg { padding: 14px 18px; background: rgba(155,47,47,.07); color: var(--danger); border-radius: 8px; }
    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border-radius: 16px; padding: 24px; max-width: 520px; width: 95%; box-shadow: 0 8px 40px rgba(0,0,0,.18); }
    .modal-title { font-size: 16px; font-weight: 700; color: var(--accent-strong); margin: 0 0 4px; }
    .modal-subtitle { font-size: 12px; color: var(--muted); margin: 0 0 20px; }
    .num-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
    .num-toggle { width: 36px; height: 36px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; font-size: 12px; font-weight: 700; color: var(--muted); display: flex; align-items: center; justify-content: center; transition: all .15s; }
    .num-toggle.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
    .num-toggle.zero.selected { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-cancel { padding: 8px 18px; border: 1.5px solid var(--border); border-radius: 8px; background: transparent; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); }
    .btn-confirm { padding: 8px 18px; background: var(--accent); border: none; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn-confirm:hover { background: var(--accent-strong); }
    .btn-confirm.danger { background: var(--danger); }
  </style>
</head>
<body>
<div class="container">
  <a class="back-link" href="/">← Início</a>
  <a class="back-link" href="/sinais-v2" style="margin-left:12px">Ver Sinais →</a>
  <a class="back-link" href="/configuracoes" style="margin-left:12px">⚙️ Configurações</a>
  <div class="page-header">
    <div>
      <h1>Gatilhos</h1>
      <p class="subtitle">Gerados a cada 21 spins por roleta. Atualiza a cada 10s.</p>
    </div>
    <div class="status-bar"><span class="dot live"></span><span id="status-text">Carregando...</span></div>
  </div>

  <div class="filter-row">
    <button class="filter-btn active" data-status="pending">Pendentes</button>
    <button class="filter-btn" data-status="expired">Expirados</button>
    <button class="filter-btn" data-status="all">Todos</button>
  </div>

  <div id="summary" class="summary-row"></div>
  <div class="table-card"><div id="content" class="loading">Carregando gatilhos...</div></div>
</div>

<!-- Modal editar aposta -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <p class="modal-title">✏️ Editar Aposta</p>
    <p class="modal-subtitle" id="edit-modal-subtitle">Selecione os números da aposta</p>
    <div class="num-grid" id="num-grid"></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal('edit-modal')">Cancelar</button>
      <button class="btn-confirm" id="btn-save-bet">Salvar aposta</button>
    </div>
  </div>
</div>

<!-- Modal confirmar exclusão -->
<div class="modal-overlay" id="del-modal">
  <div class="modal">
    <p class="modal-title">🗑️ Excluir Gatilho</p>
    <p class="modal-subtitle" id="del-modal-subtitle">Esta ação remove o gatilho e todos os sinais associados.</p>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal('del-modal')">Cancelar</button>
      <button class="btn-confirm danger" id="btn-confirm-del">Excluir</button>
    </div>
  </div>
</div>

<script>
const REFRESH_MS = 10000;
const TZ = "America/Sao_Paulo";
const CONF_WINDOW = 5;
const ROULETTE_INFO = {
  "pragmatic-auto-roulette":      { label: "Auto",   cls: "auto"   },
  "pragmatic-brazilian-roulette": { label: "Brazil", cls: "brazil" },
  "pragmatic-mega-roulette":      { label: "Mega",   cls: "mega"   },
};

let sortState = { col: "date", dir: -1 };
let statusFilter = "pending";
let allRows = [];

function ri(rid) { return ROULETTE_INFO[rid] || { label: rid || "—", cls: "" }; }

function fmtDate(iso) {
  if (!iso) return { date: "—", time: "—" };
  const d = new Date(iso), o = { timeZone: TZ };
  return {
    date: d.toLocaleDateString("pt-BR", { ...o, day: "2-digit", month: "2-digit", year: "numeric" }),
    time: d.toLocaleTimeString("pt-BR", { ...o, hour: "2-digit", minute: "2-digit", second: "2-digit" }),
  };
}

function chip(n, type) {
  const cls = n === 0 ? "zero" : type;
  return `<div class="num-chip ${cls}">${n}</div>`;
}

function filtered() {
  if (statusFilter === "all") return allRows;
  if (statusFilter === "pending") return allRows.filter(g => g.status === "pending" || g.status === "pending_confirmation");
  return allRows.filter(g => g.status === statusFilter);
}

function sorted(rows) {
  return [...rows].sort((a, b) => {
    let va, vb;
    if (sortState.col === "date")    { va = new Date(a.created_at).getTime(); vb = new Date(b.created_at).getTime(); }
    else if (sortState.col === "n")  { va = a.trigger_number ?? -1; vb = b.trigger_number ?? -1; }
    else if (sortState.col === "pct"){ va = a.trigger_pct; vb = b.trigger_pct; }
    else return 0;
    return sortState.dir * (va < vb ? -1 : va > vb ? 1 : 0);
  });
}

function sortIcon(col) {
  if (sortState.col !== col) return `<span class="sort-icon">⇅</span>`;
  return `<span class="sort-icon">${sortState.dir === 1 ? "▲" : "▼"}</span>`;
}

function renderTable(rows) {
  const s = sorted(rows);
  if (!s.length) return `<div class="empty-state"><p>Nenhum gatilho encontrado.</p></div>`;

  const cols = [
    { key: "date", label: "Data / Hora" },
    { key: null,   label: "Roleta" },
    { key: null,   label: "Geração", center: true },
    { key: null,   label: "Triplet" },
    { key: "n",    label: "Nº Gatilho", center: true },
    { key: "pct",  label: "%" },
    { key: null,   label: "Aposta" },
    { key: null,   label: "Status" },
    { key: null,   label: "Assertividade" },
    { key: null,   label: "Ações", center: true },
  ];

  const thead = `<thead><tr>${cols.map(c => {
    const parts = [c.key ? "sortable" : "", c.key && sortState.col === c.key ? "active" : "", c.center ? "center" : ""].filter(Boolean);
    return `<th class="${parts.join(" ")}" ${c.key ? `data-col="${c.key}"` : ""}>${c.label}${c.key ? sortIcon(c.key) : ""}</th>`;
  }).join("")}</tr></thead>`;

  const tbody = s.map(g => {
    const r = ri(g.roulette_id);
    const [a, b, c] = g.triplet || [];
    const { date, time } = fmtDate(g.created_at);
    const isConfirming = g.status === "pending_confirmation";
    const betLen = (g.bet_numbers || []).length;
    const sw = g.signals_won ?? 0;
    const sl = g.signals_lost ?? 0;
    const sf = sw + sl;
    const aPct = sf > 0 ? (sw / sf * 100) : null;
    const aCls = aPct === null ? "" : aPct >= 85 ? "high" : aPct >= 65 ? "mid" : "low";
    const assertCell = aPct !== null
      ? `<div><span class="assert-pct ${aCls}">${aPct.toFixed(1)}%</span></div><div><span class="won">${sw}W</span> / <span class="lost">${sl}L</span>${sf > 0 ? ` · ${sf} sinais` : ""}</div>`
      : `<span style="color:var(--muted);font-size:11px">— (sem sinais)</span>`;
    const triggerCell = isConfirming
      ? (() => {
          const pips = Array.from({length: CONF_WINDOW}, (_, i) =>
            `<span class="conf-pip ${i < (g.confirmation_spins_seen||0) ? "filled" : ""}"></span>`
          ).join("");
          const cnums = (g.confirmation_numbers||[]).map(n => chip(n, "alvo")).join("");
          return `<div style="font-size:11px;color:#005599;font-weight:700">🔍 Top-3</div>
            <div style="display:flex;gap:2px;margin-top:3px">${cnums}</div>
            <div class="conf-progress" style="margin-top:4px">${pips}</div>
            <div style="font-size:10px;color:var(--muted);margin-top:2px">${g.confirmation_spins_seen||0}/${CONF_WINDOW} jogadas</div>`;
        })()
      : chip(g.trigger_number, "trigger");
    const statusBadge = g.status === "pending"
      ? `<span class="status-badge pending">⏳ Pendente</span>`
      : g.status === "pending_confirmation"
        ? `<span class="status-badge pending_confirmation">🔍 Confirmando</span>`
        : `<span class="status-badge expired">⌛ Expirado</span>`;
    return `<tr class="${g.status === "expired" ? "row-expired" : ""}" data-id="${g.id}">
      <td class="date-cell"><div class="date">${date}</div><div class="time">${time}</div></td>
      <td><span class="roulette-badge ${r.cls}">${r.label}</span></td>
      <td class="center"><span style="font-size:11px;color:var(--muted)">#${g.generation ?? "—"}</span></td>
      <td><div class="alvos-cell">${chip(a,"alvo")}<span class="arrow">→</span>${chip(b,"alvo")}<span class="arrow">→</span>${chip(c,"alvo")}</div></td>
      <td class="center">${triggerCell}</td>
      <td><span class="pct-badge">⚡ ${Number(g.trigger_pct).toFixed(2)}%</span></td>
      <td><span style="font-size:11px;color:var(--muted)">${betLen} nºs</span></td>
      <td>${statusBadge}</td>
      <td class="signals-cell">${assertCell}</td>
      <td class="center">
        <div class="actions-cell">
          <button class="btn-action" title="Editar aposta" onclick="openEditModal('${g.id}')">✏️</button>
          <button class="btn-action danger" title="Excluir gatilho" onclick="openDelModal('${g.id}', '${a},${b},${c}')">🗑️</button>
        </div>
      </td>
    </tr>`;
  }).join("");

  return `<table>${thead}<tbody>${tbody}</tbody></table>`;
}

function rerender() {
  document.getElementById("content").innerHTML = renderTable(filtered());
  document.querySelectorAll("thead th.sortable").forEach(th => {
    th.addEventListener("click", () => {
      const col = th.dataset.col;
      sortState.col === col ? (sortState.dir *= -1) : (sortState.col = col, sortState.dir = col === "date" ? -1 : 1);
      rerender();
    });
  });
}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    statusFilter = btn.dataset.status;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    rerender();
    updateSummary();
  });
});

function updateSummary() {
  const rows = filtered();
  const pending = rows.filter(g => g.status === "pending").length;
  const confirming = rows.filter(g => g.status === "pending_confirmation").length;
  const expired = rows.filter(g => g.status === "expired").length;
  const parts = [`<strong>${rows.length}</strong> gatilhos`];
  if (pending)    parts.push(`<strong>${pending}</strong> pendentes`);
  if (confirming) parts.push(`<strong style="color:#005599">${confirming}</strong> aguardando confirmação`);
  if (expired)    parts.push(`<strong>${expired}</strong> expirados`);
  document.getElementById("summary").innerHTML = parts.join(" · ");
}

// ── Modal helpers ─────────────────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add("open"); }
function closeModal(id) { document.getElementById(id).classList.remove("open"); }
document.querySelectorAll(".modal-overlay").forEach(m => {
  m.addEventListener("click", e => { if (e.target === m) m.classList.remove("open"); });
});

// ── Edit bet modal ────────────────────────────────────────────────────────────
let _editId = null;
let _editSelected = new Set();

function openEditModal(id) {
  const g = allRows.find(x => x.id === id);
  if (!g) return;
  _editId = id;
  _editSelected = new Set(g.bet_numbers || []);
  const [a, b, c] = g.triplet || [];
  document.getElementById("edit-modal-subtitle").textContent =
    `Triplet: ${a} → ${b} → ${c}  |  Gatilho: ${g.trigger_number}`;
  renderNumGrid();
  openModal("edit-modal");
}

function renderNumGrid() {
  const grid = document.getElementById("num-grid");
  grid.innerHTML = Array.from({length: 37}, (_, n) =>
    `<button class="num-toggle ${n===0?"zero":""} ${_editSelected.has(n)?"selected":""}"
      onclick="toggleNum(${n})">${n}</button>`
  ).join("");
}

function toggleNum(n) {
  _editSelected.has(n) ? _editSelected.delete(n) : _editSelected.add(n);
  renderNumGrid();
}

document.getElementById("btn-save-bet").addEventListener("click", async () => {
  if (!_editId) return;
  const btn = document.getElementById("btn-save-bet");
  btn.disabled = true;
  btn.textContent = "Salvando...";
  try {
    const r = await fetch(`/api/gatilhos/${_editId}/bet-numbers`, {
      method: "PUT",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({bet_numbers: [..._editSelected]}),
    });
    if (!r.ok) throw new Error(await r.text());
    closeModal("edit-modal");
    await load();
  } catch(e) { alert("Erro: " + e.message); }
  finally { btn.disabled = false; btn.textContent = "Salvar aposta"; }
});

// ── Delete modal ──────────────────────────────────────────────────────────────
let _delId = null;

function openDelModal(id, tripletStr) {
  _delId = id;
  document.getElementById("del-modal-subtitle").textContent =
    `Triplet ${tripletStr} — remove gatilho e todos os sinais associados.`;
  openModal("del-modal");
}

document.getElementById("btn-confirm-del").addEventListener("click", async () => {
  if (!_delId) return;
  const btn = document.getElementById("btn-confirm-del");
  btn.disabled = true;
  btn.textContent = "Excluindo...";
  try {
    const r = await fetch(`/api/gatilhos/${_delId}`, {method: "DELETE"});
    if (!r.ok) throw new Error(await r.text());
    closeModal("del-modal");
    await load();
  } catch(e) { alert("Erro: " + e.message); }
  finally { btn.disabled = false; btn.textContent = "Excluir"; }
});

// ── Load ──────────────────────────────────────────────────────────────────────
async function load() {
  try {
    const status = statusFilter === "all" ? "" : `status=${statusFilter}&`;
    const res = await fetch(`/api/gatilhos?${status}limit=500`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    allRows = data.gatilhos || [];
    rerender();
    updateSummary();
    const now = new Date().toLocaleTimeString("pt-BR", { timeZone: TZ });
    document.getElementById("status-text").textContent = `Atualizado às ${now}`;
  } catch (err) {
    document.getElementById("content").innerHTML = `<div class="error-msg">Falha: ${err.message}</div>`;
    document.getElementById("status-text").textContent = "Erro";
  }
}

async function loop() { await load(); setTimeout(loop, REFRESH_MS); }
loop();
</script>
</body>
</html>
