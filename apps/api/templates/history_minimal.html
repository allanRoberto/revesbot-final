<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Resultados em tempo real das roletas monitoradas">
  <title>{{ roulette.name }} | Revesbot</title>
  <link rel="stylesheet" href="/static/css/tokens.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/static/css/base.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/static/css/components/roulette-selector.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/static/css/components/live-status.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/static/css/components/result-grid.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/static/css/components/number-context-panel.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/static/css/pages/history.css?v={{ asset_version }}">
</head>
<body>
  <main class="history-page" id="history-app" data-slug="{{ slug }}">
    <header class="page-header">
      <div>
        <p class="eyebrow">Resultados ao vivo</p>
        <h1 id="roulette-title">{{ roulette.name }}</h1>
      </div>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Alternar tema">◐</button>
    </header>

    <section class="toolbar" aria-label="Controles do histórico">
      <label class="field roulette-selector">
        <span>Mesa</span>
        <select id="roulette-select" aria-label="Selecionar roleta">
          {% for item in all_roulettes %}
          <option value="{{ item.slug }}"{% if item.slug == slug %} selected{% endif %}>{{ item.name }}</option>
          {% endfor %}
        </select>
      </label>

      <label class="field field--compact">
        <span>Quantidade</span>
        <select id="result-limit">
          <option value="50">50</option>
          <option value="100" selected>100</option>
          <option value="200">200</option>
          <option value="500">500</option>
        </select>
      </label>

      <label class="field field--compact">
        <span>Números por linha</span>
        <select id="grid-columns" aria-label="Selecionar números por linha">
          <option value="auto">Automático</option>
          <option value="5">5</option>
          <option value="8">8</option>
          <option value="10">10</option>
          <option value="12">12</option>
          <option value="15">15</option>
          <option value="20">20</option>
        </select>
      </label>

      <div class="live-status" id="live-status" role="status" aria-live="polite">
        <span class="live-status__dot"></span>
        <span id="live-status-text">Conectando</span>
      </div>

      <button class="button" id="socket-toggle" type="button">Pausar ao vivo</button>
      <button class="button button--secondary" id="copy-results" type="button">Copiar números</button>
      {% if roulette.url %}
      <a class="button button--secondary open-table-link" href="{{ roulette.url }}" target="_blank" rel="noopener noreferrer">Abrir mesa ↗</a>
      {% endif %}
    </section>

    <section class="results-panel" aria-labelledby="results-heading">
      <div class="results-panel__header">
        <h2 id="results-heading">Últimos resultados</h2>
        <span id="results-summary">Carregando…</span>
      </div>
      <div class="result-grid-viewport">
        <div class="result-grid" id="result-grid" aria-live="polite"></div>
      </div>
      <p class="empty-state" id="empty-state" hidden>Nenhum resultado encontrado.</p>
    </section>
  </main>

  <aside class="number-context-panel" id="number-context-panel" aria-hidden="true" aria-labelledby="number-context-title">
    <div class="number-context-panel__surface">
      <header class="number-context-panel__header">
        <div>
          <p class="eyebrow">Histórico de ocorrências</p>
          <h2 id="number-context-title">Análise do número</h2>
        </div>
        <button class="icon-button" id="number-context-close" type="button" aria-label="Fechar análise">×</button>
      </header>

      <section class="number-context-panel__section" aria-labelledby="context-ranking-title">
        <h3 id="context-ranking-title">Números que mais apareceram à frente</h3>
        <div class="context-ranking" id="context-ranking"></div>
      </section>

      <div class="number-context-panel__controls">
        <label class="field field--compact">
          <span>Números atrás</span>
          <input id="context-behind" type="number" min="0" max="20" step="1" value="3">
        </label>
        <label class="field field--compact">
          <span>Números à frente</span>
          <input id="context-ahead" type="number" min="0" max="20" step="1" value="5">
        </label>
      </div>
    </div>
  </aside>
  <script type="module" src="/static/js/pages/history.js?v={{ asset_version }}"></script>
</body>
</html>
