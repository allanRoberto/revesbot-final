<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitor de sinais por minuto</title>
  <style>
    :root { color-scheme: dark; --bg:#071018; --panel:#101d27; --line:#243746; --text:#edf7fb; --muted:#8da4b3; --cyan:#29d3c2; --green:#36d477; --red:#ff5d6c; --amber:#ffbf45; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(circle at 10% 0,#123040 0,var(--bg) 42%); color:var(--text); font:15px/1.45 Inter,system-ui,sans-serif; }
    main { width:min(1500px,96%); margin:0 auto; padding:24px 0 48px; }
    header { display:flex; gap:18px; align-items:flex-start; justify-content:space-between; margin-bottom:20px; }
    h1 { margin:0 0 6px; font-size:clamp(24px,4vw,42px); letter-spacing:-.04em; }
    h2,h3,p { margin-top:0; }
    .muted { color:var(--muted); }
    .actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    a,button,select { color:var(--text); }
    .button,select { border:1px solid var(--line); background:#142531; border-radius:10px; padding:10px 13px; text-decoration:none; cursor:pointer; }
    .button:hover { border-color:var(--cyan); }
    .stats { display:grid; grid-template-columns:repeat(6,minmax(120px,1fr)); gap:10px; margin-bottom:18px; }
    .stat { background:rgba(16,29,39,.9); border:1px solid var(--line); border-radius:14px; padding:14px; }
    .stat span { display:block; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
    .stat strong { display:block; font-size:25px; margin-top:4px; }
    .online { color:var(--green); } .offline { color:var(--red); }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border:1px solid var(--line); background:rgba(16,29,39,.75); border-radius:14px; margin-bottom:12px; }
    #signals { display:grid; gap:10px; }
    details { background:rgba(16,29,39,.94); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
    details[open] { border-color:#38566b; }
    summary { list-style:none; cursor:pointer; padding:16px; display:grid; grid-template-columns:170px 1fr 120px 130px; gap:16px; align-items:center; }
    summary::-webkit-details-marker { display:none; }
    .signal-time strong { display:block; font-size:17px; }
    .signal-time small { color:var(--muted); }
    .centers,.numbers,.attempts { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    .ball { width:31px; height:31px; border-radius:50%; display:inline-grid; place-items:center; font-weight:800; border:1px solid rgba(255,255,255,.25); box-shadow:inset 0 0 0 2px rgba(0,0,0,.18); }
    .ball.red { background:#b72b39; } .ball.black { background:#172027; } .ball.green { background:#16804b; }
    .center-ball { outline:2px solid var(--cyan); outline-offset:2px; margin:2px; }
    .progress { height:8px; background:#263743; border-radius:999px; overflow:hidden; margin-top:7px; }
    .progress i { display:block; height:100%; background:linear-gradient(90deg,var(--cyan),#57a4ff); }
    .badge { display:inline-flex; align-items:center; justify-content:center; border-radius:999px; padding:6px 10px; font-size:12px; font-weight:800; text-transform:uppercase; }
    .badge.active { background:rgba(41,211,194,.13); color:var(--cyan); }
    .badge.completed { background:rgba(141,164,179,.15); color:#c4d4dd; }
    .payments { color:var(--green); font-size:17px; font-weight:800; text-align:right; }
    .body { border-top:1px solid var(--line); padding:16px; display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .box { background:#0b161e; border:1px solid #1c2c38; padding:14px; border-radius:12px; }
    .box h3 { font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; margin-bottom:10px; }
    .attempt { min-width:76px; border:1px solid var(--line); border-radius:10px; padding:8px; text-align:center; background:#111f29; }
    .attempt.hit { border-color:var(--green); box-shadow:inset 0 0 0 1px rgba(54,212,119,.35); }
    .attempt.alt-hit { border-color:var(--amber); box-shadow:inset 0 0 0 1px rgba(255,191,69,.38); }
    .attempt small { display:block; color:var(--muted); margin-top:4px; }
    .alternative-box { border-color:rgba(255,191,69,.45); background:rgba(61,43,14,.28); }
    .alternative-flow { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:12px; }
    .alternative-flow strong { color:var(--amber); }
    .alternative-score { margin-left:auto; color:var(--amber); font-size:18px; font-weight:800; }
    .notice { padding:28px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:14px; }
    @media (max-width:1050px) { .stats{grid-template-columns:repeat(3,1fr)} summary{grid-template-columns:150px 1fr 100px}.payments{display:none}.body{grid-template-columns:1fr} }
    @media (max-width:650px) { main{width:94%} header{display:block}.actions{margin-top:14px}.stats{grid-template-columns:repeat(2,1fr)} summary{grid-template-columns:1fr 100px}.centers{grid-column:1/-1;grid-row:2}.toolbar{align-items:flex-start;flex-direction:column} }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Monitor de sinais por minuto</h1>
      <p class="muted">Novo sinal a cada minuto · todos acompanham 10 resultados independentemente.</p>
    </div>
    <div class="actions"><a class="button" href="/comparador-dias">← Comparador</a><button class="button" id="refresh">Atualizar</button></div>
  </header>

  <section class="stats">
    <div class="stat"><span>Worker</span><strong id="worker">—</strong></div>
    <div class="stat"><span>Ativos</span><strong id="active">—</strong></div>
    <div class="stat"><span>Concluídos</span><strong id="completed">—</strong></div>
    <div class="stat"><span>Sinais</span><strong id="total">—</strong></div>
    <div class="stat"><span>Tentativas</span><strong id="attempts">—</strong></div>
    <div class="stat"><span>Pagamentos</span><strong id="payments">—</strong></div>
  </section>

  <div class="toolbar">
    <div><strong>Pragmatic Auto Roulette</strong><div class="muted" id="lastUpdate">Carregando…</div></div>
    <label>Status <select id="status"><option value="all">Todos</option><option value="active">Ativos</option><option value="completed">Concluídos</option></select></label>
  </div>
  <section id="signals"><div class="notice">Carregando sinais…</div></section>
</main>
<script>
  const rouletteId = 'pragmatic-auto-roulette';
  const el = id => document.getElementById(id);
  const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
  const fmt = value => value ? new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date(value)) : '—';
  const ball = (item, center=false) => `<span class="ball ${escapeHtml(item.color)} ${center?'center-ball':''}">${escapeHtml(item.value)}</span>`;

  function renderSignal(signal) {
    const maxAttempts = Number(signal.config?.max_attempts || 10);
    const progress = Math.min(100, (Number(signal.attempt_count || 0) / maxAttempts) * 100);
    const previous = (signal.previous_results || []).map(item => ball(item)).join('');
    const region = (signal.bet_numbers || []).map(item => ball(item)).join('');
    const attempts = (signal.attempts || []).map(item => {
      const labels = [item.is_payment?'oficial':'', item.is_alternative_payment?'alternativa':''].filter(Boolean);
      return `<div class="attempt ${item.is_payment?'hit':''} ${item.is_alternative_payment?'alt-hit':''}">${ball(item)}<small>${escapeHtml(item.attempt_number)}ª · ${escapeHtml((item.formatted||'').slice(11))}${labels.length?` · ${escapeHtml(labels.join(' + '))}`:''}</small></div>`;
    }).join('') || '<span class="muted">Aguardando o próximo resultado.</span>';
    const alternative = signal.alternative_analysis || {};
    let alternativeBox = '';
    if (alternative.triggered) {
      if (alternative.alternative_center) {
        const closeCenters = (alternative.close_centers || []).map(item => ball(item)).join('');
        const alternativeRegion = (alternative.alternative_bet_numbers || []).map(item => ball(item)).join('');
        alternativeBox = `<div class="box alternative-box" style="grid-column:1/-1">
          <h3>Simulação afastada · não altera a aposta oficial</h3>
          <div class="alternative-flow"><span class="muted">Centro principal</span>${ball(alternative.primary_center,true)}<span class="muted">próximo de</span>${closeCenters}<span>→</span><strong>alternativa</strong>${ball(alternative.alternative_center,true)}<span class="muted">distância ${escapeHtml(alternative.alternative_center.wheel_distance_from_primary)} posições</span><span class="alternative-score">${escapeHtml(signal.alternative_payment_count || 0)} acerto(s)</span></div>
          <div class="numbers">${alternativeRegion}</div>
          <p class="muted" style="margin:10px 0 0">Esta região é apenas conferida nas mesmas 10 tentativas e não entra nos pagamentos oficiais.</p>
        </div>`;
      } else {
        alternativeBox = `<div class="box alternative-box" style="grid-column:1/-1"><h3>Simulação afastada</h3><p class="muted" style="margin:0">${escapeHtml(alternative.reason || 'Nenhuma região afastada disponível.')}</p></div>`;
      }
    }
    const previousText = signal.previous_region_hit
      ? `${signal.previous_region_hit_count} dos 5 anteriores estavam na região — apenas registrado, sem cancelar.`
      : 'Nenhum dos 5 anteriores estava na região.';
    return `<details ${signal.status==='active'?'open':''}>
      <summary>
        <div class="signal-time"><strong>${fmt(signal.signal_minute_utc)}</strong><small>${escapeHtml(signal.attempt_count)}/${maxAttempts} tentativas</small><div class="progress"><i style="width:${progress}%"></i></div></div>
        <div class="centers"><span class="muted">Centros</span> ${(signal.selected_centers||[]).map(item=>ball(item,true)).join('')}</div>
        <span class="badge ${escapeHtml(signal.status)}">${signal.status==='active'?'Monitorando':'Concluído'}</span>
        <div class="payments">${escapeHtml(signal.payment_count || 0)} acerto(s)</div>
      </summary>
      <div class="body">
        <div class="box"><h3>Região apostada · ${escapeHtml(signal.coverage)} números</h3><div class="numbers">${region}</div></div>
        <div class="box"><h3>5 números antes do sinal</h3><div class="numbers">${previous}</div><p class="muted" style="margin:10px 0 0">${escapeHtml(previousText)}</p></div>
        ${alternativeBox}
        <div class="box" style="grid-column:1/-1"><h3>Tentativas e pagamentos</h3><div class="attempts">${attempts}</div></div>
      </div>
    </details>`;
  }

  async function load() {
    try {
      const status = el('status').value;
      const query = new URLSearchParams({roulette_id:rouletteId,status,limit:'200'});
      const statsQuery = new URLSearchParams({roulette_id:rouletteId});
      const [itemsResponse,statsResponse] = await Promise.all([
        fetch(`/api/minute-region-signals?${query}`), fetch(`/api/minute-region-signals/stats?${statsQuery}`)
      ]);
      if (!itemsResponse.ok || !statsResponse.ok) throw new Error('A API não respondeu corretamente.');
      const data = await itemsResponse.json(); const stats = await statsResponse.json();
      el('worker').textContent = stats.worker_status==='online'?'ONLINE':'OFFLINE';
      el('worker').className = stats.worker_status==='online'?'online':'offline';
      el('active').textContent = stats.active; el('completed').textContent = stats.completed;
      el('total').textContent = stats.signals; el('attempts').textContent = stats.attempts; el('payments').textContent = stats.payments;
      el('lastUpdate').textContent = `Atualizado ${new Date().toLocaleTimeString('pt-BR')} · último sinal ${fmt(stats.latest_signal_minute_utc)}`;
      el('signals').innerHTML = data.items.length ? data.items.map(renderSignal).join('') : '<div class="notice">Nenhum sinal encontrado neste filtro.</div>';
    } catch (error) {
      el('signals').innerHTML = `<div class="notice">Erro ao carregar: ${escapeHtml(error.message)}</div>`;
    }
  }
  el('refresh').addEventListener('click', load); el('status').addEventListener('change', load);
  load(); setInterval(load, 5000);
</script>
</body>
</html>
