<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gatilhos Puxados</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-soft: #eef3f1;
      --border: #d7ddd9;
      --text: #18211f;
      --muted: #63706b;
      --accent: #177a5b;
      --accent-strong: #0f5f46;
      --danger: #9b2f2f;
      --warn: #b6862c;
      --trigger-color: #a85c00;
      --trigger-bg: rgba(168,92,0,.13);
      --triplet-color: #0f5f46;
      --triplet-bg: rgba(23,122,91,.13);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px;
    }
    .container { max-width: 1100px; margin: 0 auto; }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .page-header h1 { margin: 0 0 4px; font-size: 22px; color: var(--accent-strong); }
    .page-header .subtitle { margin: 0; font-size: 13px; color: var(--muted); }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
    .dot.live { background: var(--accent); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      margin-bottom: 14px;
    }
    .back-link:hover { text-decoration: underline; }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .filter-row label { font-size: 12px; color: var(--muted); font-weight: 600; }
    .filter-btn {
      padding: 4px 12px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: var(--muted);
      transition: all .12s;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent-strong); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .summary-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .summary-row strong { color: var(--text); }

    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead tr {
      background: var(--surface-soft);
      border-bottom: 2px solid var(--border);
    }
    thead th {
      padding: 10px 12px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      white-space: nowrap;
      user-select: none;
    }
    thead th.sortable { cursor: pointer; }
    thead th.sortable:hover { color: var(--accent-strong); background: #e8efec; }
    thead th.center { text-align: center; }
    thead th .sort-icon { display: inline-block; margin-left: 4px; opacity: 0.35; font-size: 10px; }
    thead th.active { color: var(--accent-strong); }
    thead th.active .sort-icon { opacity: 1; color: var(--accent); }

    tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f9fafb; }
    tbody tr.row-fired { background: rgba(168,92,0,.04); }
    tbody tr.row-won { background: rgba(23,122,91,.05); }
    tbody tr.row-lost { background: rgba(155,47,47,.04); }
    tbody tr.row-expired { opacity: 0.55; }

    td { padding: 8px 12px; vertical-align: middle; }
    td.center { text-align: center; }

    .date-cell .date { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; }
    .date-cell .time { font-size: 11px; color: var(--muted); margin-top: 1px; white-space: nowrap; }

    .num-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px; height: 32px;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      line-height: 1;
    }
    .num-chip.trigger {
      background: var(--trigger-bg);
      color: var(--trigger-color);
      border: 2px solid #c97a1a;
      font-size: 14px;
      width: 36px; height: 36px;
    }
    .num-chip.alvo {
      background: var(--triplet-bg);
      color: var(--triplet-color);
      border: 1.5px solid var(--accent);
    }
    .num-chip.zero {
      background: #1a1a1a;
      color: #fff;
      border: 2px solid #555;
    }

    .alvos-cell { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .arrow { font-size: 11px; color: var(--muted); }

    .roulette-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: var(--surface-soft);
      color: var(--accent-strong);
      border: 1px solid var(--border);
      white-space: nowrap;
    }
    .roulette-badge.auto   { background: rgba(23,122,91,.10); border-color: rgba(23,122,91,.25); }
    .roulette-badge.brazil { background: rgba(0,102,204,.09); color: #005599; border-color: rgba(0,102,204,.2); }
    .roulette-badge.mega   { background: rgba(120,40,180,.09); color: #6a1fa0; border-color: rgba(120,40,180,.2); }

    .pct-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      background: var(--trigger-bg);
      color: var(--trigger-color);
      border: 1px solid rgba(168,92,0,.22);
      white-space: nowrap;
    }

    /* Status badges */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      line-height: 1.3;
    }
    .status-badge.pending  { background: rgba(100,120,110,.08); color: #3d5048; border: 1px solid #c6d3cc; }
    .status-badge.fired    { background: rgba(168,92,0,.10); color: #7a4200; border: 1px solid #d9ac6a; }
    .status-badge.won      { background: rgba(23,122,91,.10); color: #0f5f46; border: 1px solid #7ecbb1; }
    .status-badge.lost     { background: rgba(155,47,47,.10); color: #7a1f1f; border: 1px solid #d98080; }
    .status-badge.expired  { background: #f0f0f0; color: #888; border: 1px solid #ccc; }

    .fired-link { display: block; font-size: 10px; margin-top: 3px; color: var(--accent); text-decoration: none; }
    .fired-link:hover { text-decoration: underline; }

    /* Assertiveness */
    .assr-cell { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .assr-pct  { font-size: 13px; font-weight: 700; }
    .assr-pct.high { color: #0f5f46; }
    .assr-pct.mid  { color: var(--warn); }
    .assr-pct.low  { color: var(--danger); }
    .assr-detail { font-size: 10px; color: var(--muted); margin-top: 1px; }

    .empty-state { text-align: center; padding: 48px 24px; color: var(--muted); }
    .loading { text-align: center; color: var(--muted); padding: 40px; font-size: 14px; }
    .error-msg { padding: 14px 18px; background: rgba(155,47,47,.07); color: var(--danger); border-radius: 8px; }

    @media (max-width: 700px) {
      td, th { padding: 7px 8px; }
      .date-cell .date { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a class="back-link" href="/">← Início</a>
    <div class="page-header">
      <div>
        <h1>Gatilhos Puxados</h1>
        <p class="subtitle">Clique no cabeçalho para ordenar. Atualiza a cada 10s.</p>
      </div>
      <div class="status-bar">
        <span class="dot live"></span>
        <span id="status-text">Carregando...</span>
      </div>
    </div>

    <div class="filter-row">
      <label>Filtrar:</label>
      <button class="filter-btn active" data-status="all">Todos</button>
      <button class="filter-btn" data-status="pending">Aguardando</button>
      <button class="filter-btn" data-status="fired">Disparados</button>
      <button class="filter-btn" data-status="won">Ganhos</button>
      <button class="filter-btn" data-status="lost">Perdidos</button>
      <button class="filter-btn" data-status="expired">Expirados</button>
    </div>

    <div id="summary" class="summary-row"></div>

    <div class="table-card">
      <div id="content" class="loading">Carregando gatilhos...</div>
    </div>
  </div>

  <script>
    const REFRESH_MS = 10000;
    const TZ = "America/Sao_Paulo";

    const ROULETTE_INFO = {
      "pragmatic-auto-roulette":      { label: "Auto",   cls: "auto"   },
      "pragmatic-brazilian-roulette": { label: "Brazil", cls: "brazil" },
      "pragmatic-mega-roulette":      { label: "Mega",   cls: "mega"   },
    };

    let sortState = { col: "date", dir: -1 };
    let statusFilter = "all";
    let allRows = [];

    function rouletteInfo(rid) {
      return ROULETTE_INFO[rid] || { label: rid || "—", cls: "" };
    }

    function formatDateBR(isoStr) {
      if (!isoStr) return { date: "—", time: "—" };
      const d = new Date(isoStr);
      const opts = { timeZone: TZ };
      const date = d.toLocaleDateString("pt-BR", { ...opts, day: "2-digit", month: "2-digit", year: "numeric" });
      const time = d.toLocaleTimeString("pt-BR", { ...opts, hour: "2-digit", minute: "2-digit", second: "2-digit" });
      return { date, time };
    }

    function chipHtml(num, type) {
      const cls = num === 0 ? "zero" : type;
      return `<div class="num-chip ${cls}">${num}</div>`;
    }

    function statusHtml(t) {
      const status = t.status || "pending";
      const labels = {
        pending:  "⏳ Aguardando",
        fired:    "⚡ Disparado",
        won:      "✓ Ganhou",
        lost:     "✗ Perdeu",
        expired:  "⌛ Expirado",
      };
      let extra = "";
      if ((status === "fired" || status === "won" || status === "lost") && t.fired_on_roulette) {
        const ri = rouletteInfo(t.fired_on_roulette);
        extra = `<a class="fired-link" href="/triplet-strategy/${t.fired_on_roulette}">→ Mesa ${ri.label}</a>`;
      }
      return `<span class="status-badge ${status}">${labels[status] || status}</span>${extra}`;
    }

    function assrHtml(assr) {
      if (!assr || assr.total_resolved === null || assr.total_resolved === 0) {
        return `<span class="assr-pct" style="color:var(--muted);font-size:11px">—</span>`;
      }
      const pct = assr.assertiveness;
      const cls = pct >= 60 ? "high" : pct >= 35 ? "mid" : "low";
      return `<div class="assr-cell">
        <div class="assr-pct ${cls}">${pct.toFixed(1)}%</div>
        <div class="assr-detail">${assr.won}W / ${assr.lost}L (${assr.total_resolved})</div>
      </div>`;
    }

    function filteredRows() {
      if (statusFilter === "all") return allRows;
      return allRows.filter(t => t.status === statusFilter);
    }

    function sortRows(rows) {
      return [...rows].sort((a, b) => {
        let va, vb;
        if (sortState.col === "date") {
          va = new Date(a.created_at).getTime();
          vb = new Date(b.created_at).getTime();
        } else if (sortState.col === "number") {
          va = a.trigger_number;
          vb = b.trigger_number;
          if (va === vb) return b.trigger_pct - a.trigger_pct;
        } else if (sortState.col === "pct") {
          va = a.trigger_pct;
          vb = b.trigger_pct;
        } else if (sortState.col === "assr") {
          va = a.assertiveness?.assertiveness ?? -1;
          vb = b.assertiveness?.assertiveness ?? -1;
        } else {
          return 0;
        }
        return sortState.dir * (va < vb ? -1 : va > vb ? 1 : 0);
      });
    }

    function sortIcon(col) {
      if (sortState.col !== col) return `<span class="sort-icon">⇅</span>`;
      return `<span class="sort-icon">${sortState.dir === 1 ? "▲" : "▼"}</span>`;
    }

    function renderTable(rows) {
      const sorted = sortRows(rows);

      if (sorted.length === 0) {
        return `<div class="empty-state"><p>Nenhum gatilho encontrado.</p></div>`;
      }

      const cols = [
        { key: "date",   label: "Data / Hora",    center: false },
        { key: "number", label: "Número",          center: true  },
        { key: null,     label: "Alvos",           center: false },
        { key: null,     label: "Roleta",          center: false },
        { key: "pct",    label: "Percentual",      center: false },
        { key: null,     label: "Status",          center: false },
        { key: "assr",   label: "Assertividade",   center: false },
      ];

      const thead = `<thead><tr>${cols.map(c => {
        const sortable = c.key ? "sortable" : "";
        const active   = c.key && sortState.col === c.key ? "active" : "";
        const center   = c.center ? "center" : "";
        const data     = c.key ? `data-col="${c.key}"` : "";
        return `<th class="${[sortable, active, center].filter(Boolean).join(" ")}" ${data}>${c.label}${c.key ? sortIcon(c.key) : ""}</th>`;
      }).join("")}</tr></thead>`;

      const tbody = sorted.map(t => {
        const ri = rouletteInfo(t.roulette_id);
        const [a, b, c] = t.triplet || [];
        const { date, time } = formatDateBR(t.created_at);
        const rowCls = ["fired","won","lost","expired"].includes(t.status) ? `row-${t.status}` : "";

        return `<tr class="${rowCls}">
          <td class="date-cell">
            <div class="date">${date}</div>
            <div class="time">${time}</div>
          </td>
          <td class="center">${chipHtml(t.trigger_number, "trigger")}</td>
          <td>
            <div class="alvos-cell">
              ${chipHtml(a, "alvo")}
              <span class="arrow">→</span>
              ${chipHtml(b, "alvo")}
              <span class="arrow">→</span>
              ${chipHtml(c, "alvo")}
            </div>
          </td>
          <td><span class="roulette-badge ${ri.cls}">${ri.label}</span></td>
          <td><span class="pct-badge">⚡ ${Number(t.trigger_pct).toFixed(2)}%</span></td>
          <td>${statusHtml(t)}</td>
          <td>${assrHtml(t.assertiveness)}</td>
        </tr>`;
      }).join("");

      return `<table>${thead}<tbody>${tbody}</tbody></table>`;
    }

    function rerenderTable() {
      document.getElementById("content").innerHTML = renderTable(filteredRows());
      attachSortListeners();
    }

    function attachSortListeners() {
      document.querySelectorAll("thead th.sortable").forEach(th => {
        th.addEventListener("click", () => {
          const col = th.dataset.col;
          if (sortState.col === col) {
            sortState.dir *= -1;
          } else {
            sortState.col = col;
            sortState.dir = col === "date" ? -1 : col === "assr" ? -1 : 1;
          }
          rerenderTable();
        });
      });
    }

    function attachFilterListeners() {
      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          statusFilter = btn.dataset.status;
          document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          rerenderTable();
          updateSummary();
        });
      });
    }

    function updateSummary() {
      const rows = filteredRows();
      const counts = {};
      for (const t of rows) {
        counts[t.status] = (counts[t.status] || 0) + 1;
      }
      const labels = { pending:"Aguardando", fired:"Disparados", won:"Ganhos", lost:"Perdidos", expired:"Expirados" };
      const parts = Object.entries(counts).map(([s, n]) => `<span><strong>${n}</strong> ${labels[s]||s}</span>`);
      document.getElementById("summary").innerHTML =
        `<strong>${rows.length}</strong> gatilho${rows.length !== 1 ? "s" : ""} — ` + (parts.join(" · ") || "—");
    }

    async function load() {
      try {
        const res = await fetch("/api/puxado-triggers?limit=500");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        allRows = data.triggers || [];

        rerenderTable();
        updateSummary();

        const now = new Date().toLocaleTimeString("pt-BR", { timeZone: TZ });
        document.getElementById("status-text").textContent = `Atualizado às ${now}`;
      } catch (err) {
        document.getElementById("content").innerHTML =
          `<div class="error-msg">Falha ao carregar: ${err.message}</div>`;
        document.getElementById("status-text").textContent = "Erro";
      }
    }

    async function loadAndSchedule() {
      await load();
      setTimeout(loadAndSchedule, REFRESH_MS);
    }

    attachFilterListeners();
    loadAndSchedule();
  </script>
</body>
</html>
