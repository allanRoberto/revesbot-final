<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sinais · Trio Ranking</title>
  <style>
    :root {
      --bg:#f6f7f9; --surface:#fff; --surface-soft:#eef3f1;
      --border:#d7ddd9; --text:#18211f; --muted:#63706b;
      --accent:#177a5b; --accent-strong:#0f5f46;
      --won:#1a6b3a; --won-bg:rgba(26,107,58,.10);
      --lost:#9b2f2f; --lost-bg:rgba(155,47,47,.10);
      --mon:#b6862c; --mon-bg:rgba(182,134,44,.10);
      --inv:#7b3fa0; --inv-bg:rgba(123,63,160,.10);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding:24px 16px;}
    .container{max-width:1280px;margin:0 auto;}
    .page-header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
    .page-header h1{margin:0 0 4px;font-size:22px;color:var(--accent-strong);}
    .page-header .subtitle{margin:0;font-size:13px;color:var(--muted);}
    .status-bar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;}
    .dot.live{background:var(--accent);animation:pulse 2s infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

    .summary-strip{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 18px;display:flex;flex-direction:column;gap:2px;min-width:100px;}
    .stat-card .val{font-size:24px;font-weight:800;line-height:1;}
    .stat-card .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);}
    .stat-card.won .val{color:var(--won);}
    .stat-card.lost .val{color:var(--lost);}
    .stat-card.mon .val{color:var(--mon);}

    .filter-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
    .filter-btn{padding:4px 14px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);}
    .filter-btn:hover{border-color:var(--accent);color:var(--accent-strong);}
    .filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
    .refresh-btn{margin-left:auto;padding:5px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);font-size:12px;cursor:pointer;color:var(--muted);}
    .refresh-btn:hover{border-color:var(--accent);color:var(--accent);}

    .table-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;overflow-x:auto;}
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:900px;}
    thead tr{background:var(--surface-soft);border-bottom:2px solid var(--border);}
    thead th{padding:9px 12px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);white-space:nowrap;}
    th.center,td.center{text-align:center;}
    tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
    tbody tr:last-child{border-bottom:none;}
    tbody tr:hover{background:#f5faf8;}
    td{padding:8px 12px;vertical-align:middle;}

    .date-cell .date{font-size:12px;font-weight:600;white-space:nowrap;}
    .date-cell .time{font-size:11px;color:var(--muted);}

    .status-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
    .status-badge.won{background:var(--won-bg);color:var(--won);}
    .status-badge.lost{background:var(--lost-bg);color:var(--lost);}
    .status-badge.monitoring{background:var(--mon-bg);color:var(--mon);}

    .num-chip{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-size:11px;font-weight:700;flex-shrink:0;}
    .num-chip.alvo{background:var(--surface-soft);color:var(--text);border:1.5px solid var(--border);}
    .num-chip.hit{background:var(--won-bg);color:var(--won);border:2px solid rgba(26,107,58,.4);}
    .num-chip.zero{background:#1a1a1a;color:#fff;border:2px solid #555;}
    .num-chip.inv{background:var(--inv-bg);color:var(--inv);border:2px solid rgba(123,63,160,.35);}
    .nums-row{display:flex;flex-wrap:wrap;gap:3px;align-items:center;}

    .att-cell{display:flex;gap:4px;align-items:center;flex-wrap:wrap;}
    .att-dot{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:2px solid transparent;}
    .att-dot.hit{background:var(--won-bg);color:var(--won);border-color:rgba(26,107,58,.4);}
    .att-dot.miss{background:var(--surface-soft);color:var(--muted);border-color:var(--border);}
    .att-dot.pending{background:#fff8e6;color:var(--mon);border-color:rgba(182,134,44,.4);}

    .post-tag{font-size:10px;color:var(--muted);padding:2px 6px;background:var(--surface-soft);border-radius:4px;border:1px solid var(--border);}
    .inv-tag{font-size:10px;color:var(--inv);padding:2px 6px;background:var(--inv-bg);border-radius:4px;border:1px solid rgba(123,63,160,.25);font-weight:600;}

    .spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty{text-align:center;padding:40px;color:var(--muted);}

    /* detail panel */
    .detail-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;justify-content:flex-end;}
    .detail-overlay.open{display:flex;}
    .detail-panel{background:var(--surface);width:440px;max-width:100%;height:100%;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;}
    .detail-panel h2{margin:0;font-size:16px;color:var(--accent-strong);}
    .detail-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}
    .drow{display:flex;gap:8px;font-size:13px;flex-wrap:wrap;}
    .drow .dk{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;padding-top:2px;min-width:80px;}
    .drow .dv{font-weight:600;}
    .rank-table{width:100%;border-collapse:collapse;font-size:12px;}
    .rank-table td{padding:4px 8px;border-bottom:1px solid var(--border);}
    .rank-table tr:last-child td{border-bottom:none;}
    .rank-bar-wrap{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
    .rank-bar-fill{height:100%;border-radius:3px;background:var(--accent);}
    .rank-row{display:flex;align-items:center;gap:6px;}
  </style>
</head>
<body>
<div class="container">
  <div class="page-header">
    <div>
      <h1>Sinais · Trio Ranking</h1>
      <p class="subtitle">worker: trio-ranking-worker-prod · pragmatic-auto-roulette · history=5 · next3 top10</p>
    </div>
    <div class="status-bar">
      <span class="dot live" id="live-dot"></span>
      <span id="live-label">ao vivo</span>
    </div>
  </div>

  <div class="summary-strip" id="summary-strip">
    <div class="stat-card"><span class="val" id="stat-total">—</span><span class="lbl">Total</span></div>
    <div class="stat-card won"><span class="val" id="stat-won">—</span><span class="lbl">Won</span></div>
    <div class="stat-card lost"><span class="val" id="stat-lost">—</span><span class="lbl">Lost</span></div>
    <div class="stat-card mon"><span class="val" id="stat-mon">—</span><span class="lbl">Monitorando</span></div>
    <div class="stat-card"><span class="val" id="stat-wr">—</span><span class="lbl">Assertividade</span></div>
  </div>

  <div class="filter-row">
    <button class="filter-btn active" onclick="setFilter('all',this)">Todos</button>
    <button class="filter-btn" onclick="setFilter('monitoring',this)">Monitorando</button>
    <button class="filter-btn" onclick="setFilter('won',this)">Won</button>
    <button class="filter-btn" onclick="setFilter('lost',this)">Lost</button>
    <button class="refresh-btn" onclick="load()">↻ Atualizar</button>
  </div>

  <div id="loading" style="display:none;padding:20px;text-align:center;"><span class="spinner"></span></div>

  <div class="table-card" id="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Data/Hora</th>
          <th class="center">Status</th>
          <th>Histórico</th>
          <th>Top 10 apostados</th>
          <th class="center">Tentativas</th>
          <th class="center">Pago em</th>
          <th class="center">Inversão</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none;">Nenhum sinal encontrado.</div>
  </div>
</div>

<!-- Detail side panel -->
<div class="detail-overlay" id="detail-overlay" onclick="closeDetail(event)">
  <div class="detail-panel" id="detail-panel">
    <button class="detail-close" onclick="closeDetailBtn()">✕</button>
    <h2>Detalhe do sinal</h2>
    <div id="detail-content"></div>
  </div>
</div>

<script>
const BASE = window.location.origin;
let currentFilter = 'all';
let autoRefresh;

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  load();
}

function numChip(n, cls='alvo') {
  const c = n === 0 ? 'zero' : cls;
  return `<span class="num-chip ${c}">${n}</span>`;
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const date = d.toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit'});
  const time = d.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  return `<div class="date-cell"><div class="date">${date}</div><div class="time">${time}</div></div>`;
}

function statusBadge(s) {
  const labels = {won:'Won ✓', lost:'Lost ✗', monitoring:'Monitorando…'};
  return `<span class="status-badge ${s}">${labels[s]||s}</span>`;
}

function attDots(attempts, maxAtt, topN) {
  const top = new Set(topN);
  let html = '';
  for (let i = 0; i < maxAtt; i++) {
    const a = attempts[i];
    if (!a) {
      html += `<span class="att-dot pending">·</span>`;
    } else if (a.hit) {
      html += `<span class="att-dot hit" title="Tent ${a.attempt}: ${a.value} ✓">${a.value}</span>`;
    } else {
      html += `<span class="att-dot miss" title="Tent ${a.attempt}: ${a.value}">${a.value}</span>`;
    }
  }
  return `<div class="att-cell">${html}</div>`;
}

async function load() {
  document.getElementById('loading').style.display = '';
  document.getElementById('table-wrap').style.opacity = '0.4';
  try {
    const url = `${BASE}/api/trio-ranking-signals?status=${currentFilter}&limit=100`;
    const r = await fetch(url);
    const data = await r.json();

    // Summary
    document.getElementById('stat-total').textContent = data.total;
    document.getElementById('stat-won').textContent   = data.won;
    document.getElementById('stat-lost').textContent  = data.lost;
    document.getElementById('stat-mon').textContent   = data.monitoring;
    const fin = data.won + data.lost;
    const wr  = fin > 0 ? (data.won / fin * 100).toFixed(1) + '%' : '—';
    document.getElementById('stat-wr').textContent = wr;

    const tbody = document.getElementById('tbody');
    if (!data.signals.length) {
      tbody.innerHTML = '';
      document.getElementById('empty').style.display = '';
    } else {
      document.getElementById('empty').style.display = 'none';
      const maxAtt = data.signals[0]?.config?.max_attempts || 4;
      tbody.innerHTML = data.signals.map(s => {
        const postInfo = s.post_attempts.length > 0
          ? `<span class="post-tag">+${s.post_attempts.length} post</span>` : '';
        const invTag = s.inversion
          ? `<span class="inv-tag" title="Inversão: ${s.inversion_numbers.join(',')}">inv ${s.inversion_numbers.join(',')}</span>` : '';
        const histChips = [...s.history_numbers].reverse()
          .map(n => numChip(n)).join('');
        const topChips = s.top_n.map(n => {
          const isWinner = s.attempts.some(a => a.hit && a.value === n);
          return numChip(n, isWinner ? 'hit' : 'alvo');
        }).join('');
        return `<tr onclick="showDetail('${s.id}')" style="cursor:pointer;">
          <td>${fmtDate(s.created_at)}</td>
          <td class="center">${statusBadge(s.status)}</td>
          <td><div class="nums-row">${histChips}</div></td>
          <td><div class="nums-row">${topChips}</div></td>
          <td class="center">${attDots(s.attempts, maxAtt, s.top_n)}</td>
          <td class="center">${s.won_at_attempt ? `<strong>${s.won_at_attempt}ª</strong>` : (s.status==='lost'?'<span style="color:var(--lost)">—</span>':'<span style="color:var(--muted)">…</span>')}</td>
          <td class="center">${invTag || '<span style="color:var(--muted);font-size:11px;">—</span>'}</td>
          <td style="color:var(--muted);font-size:12px;">${postInfo}</td>
        </tr>`;
      }).join('');
    }
  } catch(e) {
    console.error(e);
  } finally {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('table-wrap').style.opacity = '1';
  }
}

async function showDetail(id) {
  const r = await fetch(`${BASE}/api/trio-ranking-signals/${id}`);
  const s = await r.json();

  const maxScore = s.ranking.length ? s.ranking[0].score : 1;
  const rankRows = s.ranking.map(item => {
    const pct = maxScore > 0 ? (item.score / maxScore * 100) : 0;
    const isTop = s.top_n.includes(item.number);
    const isWinner = s.attempts.some(a => a.hit && a.value === item.number);
    return `<tr>
      <td style="font-weight:700;color:${isTop?'var(--accent-strong)':'var(--muted)'};">${item.number}</td>
      <td>
        <div class="rank-row">
          <div class="rank-bar-wrap"><div class="rank-bar-fill" style="width:${pct}%"></div></div>
          <span style="font-size:11px;min-width:24px;text-align:right;">${item.score}</span>
        </div>
      </td>
      <td style="font-size:11px;text-align:right;">${isTop?'<strong>top</strong>':''}${isWinner?' ✓':''}</td>
    </tr>`;
  }).join('');

  const postRows = s.post_attempts.map(p =>
    `<div style="font-size:12px;display:flex;gap:8px;padding:3px 0;border-bottom:1px solid var(--border);">
      <span style="color:var(--muted);">+${p.spin}</span>
      <strong style="color:${p.hit?'var(--won)':'var(--text)'};">${p.value}</strong>
      ${p.hit?'<span style="color:var(--won);">✓ acertou aqui</span>':''}
    </div>`
  ).join('');

  document.getElementById('detail-content').innerHTML = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
      ${statusBadge(s.status)}
      ${s.inversion ? `<span class="inv-tag">inversão: ${s.inversion_numbers.join(', ')}</span>` : ''}
    </div>
    <div class="drow"><span class="dk">Criado</span><span class="dv">${new Date(s.created_at).toLocaleString('pt-BR')}</span></div>
    <div class="drow"><span class="dk">Resolvido</span><span class="dv">${s.resolved_at ? new Date(s.resolved_at).toLocaleString('pt-BR') : '—'}</span></div>
    <div class="drow"><span class="dk">Histórico</span><span class="dv">
      <div class="nums-row">${[...s.history_numbers].reverse().map(n=>numChip(n)).join('')}</div>
    </span></div>
    <div class="drow"><span class="dk">Top 10</span><span class="dv">
      <div class="nums-row">${s.top_n.map(n=>{const hit=s.attempts.some(a=>a.hit&&a.value===n);return numChip(n,hit?'hit':'alvo');}).join('')}</div>
    </span></div>

    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-top:4px;">Tentativas</div>
    <div style="display:flex;flex-direction:column;gap:4px;">
      ${s.attempts.map(a=>`<div style="display:flex;gap:8px;align-items:center;font-size:13px;padding:4px 0;border-bottom:1px solid var(--border);">
        <span style="color:var(--muted);min-width:14px;">${a.attempt}</span>
        <span class="num-chip ${a.hit?'hit':'alvo'}">${a.value}</span>
        <span style="color:${a.hit?'var(--won)':'var(--muted)'};">${a.hit?'✓ acertou':'miss'}</span>
      </div>`).join('') || '<span style="color:var(--muted);font-size:12px;">nenhuma tentativa ainda</span>'}
    </div>

    ${s.post_attempts.length ? `
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-top:4px;">Pós-derrota</div>
    ${postRows}` : ''}

    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-top:4px;">Ranking completo</div>
    <table class="rank-table">${rankRows}</table>
  `;
  document.getElementById('detail-overlay').classList.add('open');
}

function closeDetail(e) {
  if (e.target === document.getElementById('detail-overlay'))
    document.getElementById('detail-overlay').classList.remove('open');
}
function closeDetailBtn() {
  document.getElementById('detail-overlay').classList.remove('open');
}

// Auto-refresh a cada 5s se há sinal monitorando
async function maybeAutoRefresh() {
  const r = await fetch(`${BASE}/api/trio-ranking-signals?status=monitoring&limit=1`);
  const d = await r.json();
  if (d.monitoring > 0) load();
}

load();
setInterval(maybeAutoRefresh, 5000);
</script>
</body>
</html>
