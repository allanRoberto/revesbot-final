<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estratégia Trigrama — Roletas</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-soft: #eef3f1;
      --border: #d7ddd9;
      --text: #18211f;
      --muted: #63706b;
      --accent: #177a5b;
      --accent-strong: #0f5f46;
      --danger: #9b2f2f;
      --warn: #b6862c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 24px 16px; }
    .container { max-width: 1080px; margin: 0 auto; }
    h1 { margin: 0 0 4px 0; font-size: 24px; color: var(--accent-strong); }
    .subtitle { color: var(--muted); margin: 0 0 24px 0; font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .scoreboard {
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: white;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-around;
      box-shadow: 0 4px 16px rgba(15, 95, 70, 0.18);
    }
    .scoreboard .sb-block { text-align: center; min-width: 100px; }
    .scoreboard .sb-label { font-size: 11px; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
    .scoreboard .sb-value { font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .scoreboard .sb-value.assert { font-size: 32px; }
    .scoreboard .sb-value.profit-up { color: #d4f7e0; }
    .scoreboard .sb-value.profit-down { color: #fbcaca; }
    .scoreboard .sb-divider { width: 1px; height: 40px; background: rgba(255, 255, 255, 0.25); }
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .chart-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    .chart-card h2 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
    .max-loss { font-size: 13px; color: var(--muted); }
    .max-loss strong { color: var(--danger); font-variant-numeric: tabular-nums; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); }
    .filter-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: var(--surface-soft);
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      border: 1px solid transparent;
    }
    .filter-item input { margin: 0; cursor: pointer; }
    .filter-item:has(input:checked) { background: rgba(23, 122, 91, 0.12); border-color: var(--accent); color: var(--accent-strong); }
    .chart-wrap { height: 280px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(15, 95, 70, 0.08);
      border-color: var(--accent);
    }
    .card .name { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: var(--accent-strong); word-break: break-all; }
    .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .stat {
      flex: 1;
      min-width: 70px;
      padding: 8px 10px;
      background: var(--surface-soft);
      border-radius: 8px;
      text-align: center;
    }
    .stat .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat .value { font-size: 17px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .stat.win .value { color: var(--accent-strong); }
    .stat.loss .value { color: var(--danger); }
    .stat.assert .value { color: var(--accent); }
    .stat.profit-up .value { color: var(--accent-strong); }
    .stat.profit-down .value { color: var(--danger); }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .badge.open { background: rgba(182, 134, 44, 0.15); color: var(--warn); }
    .badge.idle { background: var(--surface-soft); color: var(--muted); }
    .footer-note { color: var(--muted); font-size: 12px; margin-top: 24px; text-align: center; }
    .loading { text-align: center; color: var(--muted); padding: 32px; }
    .error { color: var(--danger); padding: 16px; background: rgba(155, 47, 47, 0.06); border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Estratégia Trigrama — Roletas Monitoradas</h1>
    <p class="subtitle">Clique em uma roleta para ver as apostas em tempo real.</p>

    <div id="scoreboard" class="scoreboard" style="display: none;"></div>
    <div class="chart-card" id="chart-card" style="display: none;">
      <div class="chart-header">
        <h2>Evolução do saldo geral (fichas)</h2>
        <div class="max-loss">Máx. perda: <strong id="max-loss-val">0,00</strong></div>
      </div>
      <div class="filter-row" id="filter-row"></div>
      <div class="chart-wrap"><canvas id="global-chart"></canvas></div>
    </div>
    <div id="content" class="loading">Carregando...</div>
    <div class="footer-note" id="footer-note"></div>
  </div>

  <script>
    function formatChips(v) {
      const sign = v >= 0 ? "+" : "";
      return sign + v.toFixed(2);
    }

    function profitFor(bet, config) {
      const N = bet.bet_size || 15;
      const payouts = config.payout_by_roulette || {};
      const P = payouts[bet.roulette_id] != null ? payouts[bet.roulette_id] : 36;
      const stakes = config.per_attempt_per_number_stake || [1.0, 1.5, 2.0, 2.5];
      if (bet.status === "lost") {
        return -stakes.reduce((s, x) => s + x, 0) * N;
      }
      const k = bet.won_at_attempt;
      if (!k || k < 1) return 0;
      const cumStake = stakes.slice(0, k).reduce((s, x) => s + x, 0) * N;
      const grossWin = stakes[k - 1] * P;
      return grossWin - cumStake;
    }

    function computeTotals(series, allowedSet) {
      const config = series.config || {};
      let global = 0;
      const byRoulette = {};
      const points = [];
      (series.bets || []).forEach((bet) => {
        const p = profitFor(bet, config);
        byRoulette[bet.roulette_id] = (byRoulette[bet.roulette_id] || 0) + p;
        if (allowedSet && !allowedSet.has(bet.roulette_id)) return;
        global += p;
        points.push({ index: points.length + 1, global, resolved_at: bet.resolved_at });
      });
      const minBalance = points.length ? Math.min(0, ...points.map(p => p.global)) : 0;
      return { global, byRoulette, points, minBalance };
    }

    let chart = null;
    function renderChart(points, minBalance) {
      const card = document.getElementById("chart-card");
      const canvas = document.getElementById("global-chart");
      const lossEl = document.getElementById("max-loss-val");
      const lossAbs = Math.abs(Math.min(0, minBalance || 0));
      lossEl.textContent = lossAbs > 0 ? `-${lossAbs.toFixed(2)} fichas` : "0,00 fichas";
      if (!points.length) {
        card.style.display = "none";
        return;
      }
      card.style.display = "block";
      const labels = points.map(p => p.index);
      const balanceData = points.map(p => Number(p.global.toFixed(2)));
      const minLineData = labels.map(() => Number((minBalance || 0).toFixed(2)));
      if (chart) {
        chart.data.labels = labels;
        chart.data.datasets[0].data = balanceData;
        chart.data.datasets[1].data = minLineData;
        chart.update("none");
        return;
      }
      chart = new Chart(canvas, {
        type: "line",
        data: {
          labels,
          datasets: [
            {
              label: "Saldo (fichas)",
              data: balanceData,
              borderColor: "#177a5b",
              backgroundColor: "rgba(23, 122, 91, 0.12)",
              fill: true,
              tension: 0.2,
              pointRadius: 0,
              borderWidth: 2,
            },
            {
              label: "Máx. perda",
              data: minLineData,
              borderColor: "rgba(155, 47, 47, 0.7)",
              borderDash: [5, 5],
              borderWidth: 1,
              pointRadius: 0,
              fill: false,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { intersect: false, mode: "index" },
          plugins: {
            legend: { display: true, position: "top", labels: { boxWidth: 12, font: { size: 11 } } },
            tooltip: {
              callbacks: {
                title: (items) => `Aposta #${items[0].label}`,
                label: (item) => {
                  if (item.dataset.label === "Máx. perda") return `Máx. perda: ${formatChips(item.parsed.y)} fichas`;
                  return `Saldo: ${formatChips(item.parsed.y)} fichas`;
                },
              },
            },
          },
          scales: {
            x: { title: { display: true, text: "Apostas resolvidas" } },
            y: { title: { display: true, text: "Saldo (fichas)" } },
          },
        },
      });
    }

    function ensureFilter(roulettes) {
      const row = document.getElementById("filter-row");
      if (row.dataset.built === "1") return;
      row.innerHTML = roulettes.map(rid => `
        <label class="filter-item">
          <input type="checkbox" data-rid="${rid}" checked>
          <span>${rid}</span>
        </label>
      `).join("");
      row.dataset.built = "1";
      row.querySelectorAll("input[type=checkbox]").forEach(cb => {
        cb.addEventListener("change", onFilterChange);
      });
    }

    function getAllowedSet() {
      const set = new Set();
      document.querySelectorAll("#filter-row input[type=checkbox]").forEach(cb => {
        if (cb.checked) set.add(cb.dataset.rid);
      });
      return set;
    }

    let lastSummary = null;
    let lastSeries = null;

    function onFilterChange() {
      if (!lastSummary || !lastSeries) return;
      const allowed = getAllowedSet();
      const totals = computeTotals(lastSeries, allowed);
      render(lastSummary, totals, allowed);
      renderChart(totals.points, totals.minBalance);
    }

    async function load() {
      const content = document.getElementById("content");
      const footer = document.getElementById("footer-note");
      try {
        const [summaryRes, seriesRes] = await Promise.all([
          fetch("/api/triplet-strategy/summary"),
          fetch("/api/triplet-strategy/series"),
        ]);
        if (!summaryRes.ok || !seriesRes.ok) {
          content.innerHTML = `<div class="error">Erro ${summaryRes.status}/${seriesRes.status}</div>`;
          return;
        }
        const summary = await summaryRes.json();
        const series = await seriesRes.json();
        lastSummary = summary;
        lastSeries = series;
        ensureFilter((summary.roulettes || []).map(r => r.roulette_id));
        const allowed = getAllowedSet();
        const totals = computeTotals(series, allowed);
        render(summary, totals, allowed);
        renderChart(totals.points, totals.minBalance);
        const cfg = summary.config || {};
        footer.textContent = `Cobertura: ${cfg.top_n} números + zero • Máx. tentativas: ${cfg.max_attempts} • Stakes/num por tentativa: ${(cfg.per_attempt_per_number_stake || []).join(" → ")} fichas`;
      } catch (err) {
        content.innerHTML = `<div class="error">Falha: ${err.message}</div>`;
      }
    }
    function render(data, totals, allowed) {
      const content = document.getElementById("content");
      const scoreboard = document.getElementById("scoreboard");
      if (!data.roulettes || data.roulettes.length === 0) {
        content.innerHTML = "<p>Nenhuma roleta monitorada.</p>";
        scoreboard.style.display = "none";
        return;
      }
      const filterSet = allowed || new Set(data.roulettes.map(r => r.roulette_id));
      const filtered = data.roulettes.filter(r => filterSet.has(r.roulette_id));
      const totalWon = filtered.reduce((s, r) => s + (r.won || 0), 0);
      const totalLost = filtered.reduce((s, r) => s + (r.lost || 0), 0);
      const totalResolved = totalWon + totalLost;
      const assertGeneral = totalResolved > 0 ? (totalWon / totalResolved * 100) : 0;
      const profitClass = totals.global >= 0 ? "profit-up" : "profit-down";
      const filterTag = filtered.length < data.roulettes.length
        ? `<div style="width:100%;text-align:center;font-size:11px;opacity:0.85;margin-bottom:-6px;">${filtered.length} de ${data.roulettes.length} roletas selecionadas</div>`
        : "";
      scoreboard.style.display = "flex";
      scoreboard.innerHTML = `
        ${filterTag}
        <div class="sb-block"><div class="sb-label">Vitórias</div><div class="sb-value">${totalWon}</div></div>
        <div class="sb-divider"></div>
        <div class="sb-block"><div class="sb-label">Perdas</div><div class="sb-value">${totalLost}</div></div>
        <div class="sb-divider"></div>
        <div class="sb-block"><div class="sb-label">Assertividade Geral</div><div class="sb-value assert">${assertGeneral.toFixed(2)}%</div></div>
        <div class="sb-divider"></div>
        <div class="sb-block"><div class="sb-label">Fichas (lucro)</div><div class="sb-value ${profitClass}">${formatChips(totals.global)}</div></div>
        <div class="sb-divider"></div>
        <div class="sb-block"><div class="sb-label">Total Resolvidas</div><div class="sb-value">${totalResolved}</div></div>
      `;
      const grid = document.createElement("div");
      grid.className = "grid";
      data.roulettes.forEach(r => {
        const a = document.createElement("a");
        a.className = "card";
        a.href = `/triplet-strategy/${encodeURIComponent(r.roulette_id)}`;
        const badge = r.has_open_bet
          ? `<span class="badge open">Aposta em ${r.current_attempts}/${(data.config || {}).max_attempts || 4}</span>`
          : `<span class="badge idle">Aguardando trio válido</span>`;
        const profit = totals.byRoulette[r.roulette_id] || 0;
        const pClass = profit >= 0 ? "profit-up" : "profit-down";
        a.innerHTML = `
          <div class="name">${r.roulette_id}</div>
          <div class="stats">
            <div class="stat win"><div class="label">V</div><div class="value">${r.won}</div></div>
            <div class="stat loss"><div class="label">P</div><div class="value">${r.lost}</div></div>
            <div class="stat assert"><div class="label">%</div><div class="value">${r.assertiveness.toFixed(1)}%</div></div>
            <div class="stat ${pClass}"><div class="label">Fichas</div><div class="value">${formatChips(profit)}</div></div>
          </div>
          ${badge}
        `;
        grid.appendChild(a);
      });
      content.innerHTML = "";
      content.appendChild(grid);
    }
    async function loadAndSchedule() {
      try {
        await load();
      } finally {
        setTimeout(loadAndSchedule, 15000);
      }
    }
    loadAndSchedule();
  </script>
</body>
</html>
