<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estratégia Trigrama — Roletas</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-soft: #eef3f1;
      --border: #d7ddd9;
      --text: #18211f;
      --muted: #63706b;
      --accent: #177a5b;
      --accent-strong: #0f5f46;
      --danger: #9b2f2f;
      --warn: #b6862c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 24px 16px; }
    .container { max-width: 980px; margin: 0 auto; }
    h1 { margin: 0 0 4px 0; font-size: 24px; color: var(--accent-strong); }
    .subtitle { color: var(--muted); margin: 0 0 24px 0; font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(15, 95, 70, 0.08);
      border-color: var(--accent);
    }
    .card .name { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: var(--accent-strong); word-break: break-all; }
    .stats { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
    .stat {
      flex: 1;
      min-width: 90px;
      padding: 8px 10px;
      background: var(--surface-soft);
      border-radius: 8px;
      text-align: center;
    }
    .stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat .value { font-size: 18px; font-weight: 700; margin-top: 2px; }
    .stat.win .value { color: var(--accent-strong); }
    .stat.loss .value { color: var(--danger); }
    .stat.assert .value { color: var(--accent); }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .badge.open { background: rgba(182, 134, 44, 0.15); color: var(--warn); }
    .badge.idle { background: var(--surface-soft); color: var(--muted); }
    .footer-note { color: var(--muted); font-size: 12px; margin-top: 24px; text-align: center; }
    .loading { text-align: center; color: var(--muted); padding: 32px; }
    .error { color: var(--danger); padding: 16px; background: rgba(155, 47, 47, 0.06); border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Estratégia Trigrama — Roletas Monitoradas</h1>
    <p class="subtitle">Clique em uma roleta para ver as apostas em tempo real.</p>

    <div id="content" class="loading">Carregando...</div>
    <div class="footer-note" id="footer-note"></div>
  </div>

  <script>
    async function load() {
      const content = document.getElementById("content");
      const footer = document.getElementById("footer-note");
      try {
        const res = await fetch("/api/triplet-strategy/summary");
        if (!res.ok) {
          content.innerHTML = `<div class="error">Erro ${res.status}</div>`;
          return;
        }
        const data = await res.json();
        render(data);
        const cfg = data.config || {};
        footer.textContent = `Cobertura: ${cfg.top_n} números + zero • Máx. tentativas por aposta: ${cfg.max_attempts}`;
      } catch (err) {
        content.innerHTML = `<div class="error">Falha: ${err.message}</div>`;
      }
    }
    function render(data) {
      const content = document.getElementById("content");
      if (!data.roulettes || data.roulettes.length === 0) {
        content.innerHTML = "<p>Nenhuma roleta monitorada.</p>";
        return;
      }
      const grid = document.createElement("div");
      grid.className = "grid";
      data.roulettes.forEach(r => {
        const a = document.createElement("a");
        a.className = "card";
        a.href = `/triplet-strategy/${encodeURIComponent(r.roulette_id)}`;
        const badge = r.has_open_bet
          ? `<span class="badge open">Aposta em ${r.current_attempts}/${(data.config || {}).max_attempts || 4}</span>`
          : `<span class="badge idle">Aguardando trio válido</span>`;
        a.innerHTML = `
          <div class="name">${r.roulette_id}</div>
          <div class="stats">
            <div class="stat win"><div class="label">Vitórias</div><div class="value">${r.won}</div></div>
            <div class="stat loss"><div class="label">Perdas</div><div class="value">${r.lost}</div></div>
            <div class="stat assert"><div class="label">Assertividade</div><div class="value">${r.assertiveness.toFixed(2)}%</div></div>
          </div>
          ${badge}
        `;
        grid.appendChild(a);
      });
      content.innerHTML = "";
      content.appendChild(grid);
    }
    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
