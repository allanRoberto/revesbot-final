map $http_upgrade $revesbot_connection_upgrade {
    default upgrade;
    '' close;
}

upstream revesbot_api_minimal {
    server 127.0.0.1:8082;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.revesbot.com.br;

    ssl_certificate /etc/letsencrypt/live/api.revesbot.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.revesbot.com.br/privkey.pem;

    client_max_body_size 1m;

    location = /jev {
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location = /api/jev/historico {
        limit_except GET { deny all; }
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location = /api/jev/analisar {
        limit_except POST { deny all; }
        # Keep a small margin so the API returns its structured 262144-byte error.
        client_max_body_size 300k;
        proxy_pass http://revesbot_api_minimal;
        proxy_read_timeout 35s;
        include proxy_params;
    }

    location = /api/jev/ranking {
        limit_except POST { deny all; }
        client_max_body_size 300k;
        proxy_pass http://revesbot_api_minimal;
        proxy_read_timeout 35s;
        include proxy_params;
    }

    location = /api/jev/avaliar {
        limit_except POST { deny all; }
        client_max_body_size 300k;
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location = /api/jev/backtest/iniciar {
        limit_except POST { deny all; }
        client_max_body_size 300k;
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location = /api/jev/backtest/proximo {
        limit_except POST { deny all; }
        client_max_body_size 300k;
        proxy_pass http://revesbot_api_minimal;
        proxy_read_timeout 35s;
        include proxy_params;
    }

    location ~ "^/api/jev/backtest/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" {
        limit_except GET { deny all; }
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location = /api/triple-context-ranking {
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location = /ranking-trios {
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location = /backtest-trios {
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location = /api/triple-context-backtest {
        limit_except POST { deny all; }
        proxy_pass http://revesbot_api_minimal;
        proxy_read_timeout 60s;
        include proxy_params;
    }

    location = /api/roulettes-list {
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location = /api/patterns {
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location ^~ /api/patterns/ {
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location ~ "^/patterns/(?:[a-z][a-z0-9_-]{1,63})$" {
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location ~ ^/history/(?:[a-z0-9-]+)$ {
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location ~ ^/history-app/(?:[a-z0-9-]+)$ {
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location ~ ^/history-detailed/(?:[a-z0-9-]+)$ {
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location = /webhooks/pixgo {
        limit_except POST { deny all; }
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location = /ws {
        proxy_pass http://revesbot_api_minimal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $revesbot_connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location /static/ {
        alias /var/www/revesbot/api-current/apps/api/static/;
        expires off;
        add_header Cache-Control "no-cache";
    }

    location / { return 404; }
}
