map $http_upgrade $revesbot_connection_upgrade {
    default upgrade;
    '' close;
}

upstream revesbot_api_minimal {
    server 127.0.0.1:8082;
    keepalive 16;
}

server {
    server_name api.revesbot.com.br;

    client_max_body_size 1m;

    location = /api/roulettes-list {
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location = /analisador-gatilhos {
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location = /api/roulette-analyzer {
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location = /api/roulette-analyzer/roulettes {
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location = /api/patterns {
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location ^~ /api/patterns/ {
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location ~ "^/patterns/(?:[a-z][a-z0-9_-]{1,63})$" {
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location ~ ^/history/(?:[a-z0-9-]+)$ {
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location ~ ^/history-app/(?:[a-z0-9-]+)$ {
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location ~ ^/history-detailed/(?:[a-z0-9-]+)$ {
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location = /webhooks/pixgo {
        limit_except POST { deny all; }
        proxy_pass http://revesbot_api_minimal;
        include proxy_params;
    }

    location = /ws {
        proxy_pass http://revesbot_api_minimal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $revesbot_connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location /static/ {
        alias /var/www/revesbot/api-current/apps/api/static/;
        expires off;
        add_header Cache-Control "no-cache";
    }

    location / { return 404; }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.revesbot.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.revesbot.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}


server {
    if ($host = api.revesbot.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name api.revesbot.com.br;
    return 404; # managed by Certbot
}
