map $http_cf_connecting_ip $revesbot_auth_client_ip {
    default $http_cf_connecting_ip;
    "" $binary_remote_addr;
}

limit_req_zone $revesbot_auth_client_ip zone=revesbot_auth_login:10m rate=10r/m;

upstream revesbot_auth {
    server 127.0.0.1:3090;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name auth.revesbot.com.br;

    client_max_body_size 1m;

    location = /auth/login {
        limit_req zone=revesbot_auth_login burst=10 nodelay;
        proxy_pass http://revesbot_auth;
        include /etc/nginx/proxy_params;
    }

    location = /api/auth/login {
        limit_req zone=revesbot_auth_login burst=10 nodelay;
        proxy_pass http://revesbot_auth;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://revesbot_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
